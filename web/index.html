    #app-loading { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; box-sizing: border-box; color: #173b6b; background: #f6f5f1; }

    #app-loading-spinner { width: 30px; height: 30px; border: 3px solid #d3dcea; border-top-color: #1b56b8; border-radius: 50%; animation: app-spin .8s linear infinite; }

    @media (prefers-reduced-motion: reduce) { #app-loading-spinner { animation-duration: 2s; } }

  <script>
    window.showAppLoadError = function (detail) {
      const loader = document.getElementById('app-loading');
      if (!loader) return;
      loader.dataset.error = 'true';
      let msg = '\u05d4\u05d0\u05e4\u05dc\u05d9\u05e7\u05e6\u05d9\u05d4 \u05dc\u05d0 \u05e0\u05d8\u05e2\u05e0\u05d4. \u05d5\u05d3\u05d0\u05d5 \u05e9\u05db\u05dc \u05d4\u05e7\u05d1\u05e6\u05d9\u05dd \u05de\u05ea\u05d9\u05e7\u05d9\u05d9\u05ea build/web \u05d4\u05d5\u05e2\u05dc\u05d5 (\u05db\u05d5\u05dc\u05dc main.dart.js \u05d5-canvaskit), \u05d5\u05d0\u05d6 \u05e8\u05e2\u05e0\u05e0\u05d5.';
      if (detail) msg += '\n(' + (detail.message || detail) + ')';
      document.getElementById('app-loading-status').textContent = msg;
    };
    // 60 \u05e9\u05e0\u05d9\u05d5\u05ea: \u05d7\u05d9\u05d1\u05d5\u05e8 \u05d0\u05d9\u05d8\u05d9 \u05e6\u05e8\u05d9\u05da \u05d6\u05de\u05df \u05dc\u05d4\u05d5\u05e8\u05d9\u05d3 \u05d0\u05ea \u05de\u05e0\u05d5\u05e2 Flutter \u05d1\u05e4\u05e2\u05dd \u05d4\u05e8\u05d0\u05e9\u05d5\u05e0\u05d4.
    const appLoadTimeout = window.setTimeout(function () { window.showAppLoadError(); }, 60000);
    window.addEventListener('flutter-first-frame', function () {
      window.clearTimeout(appLoadTimeout);
      document.getElementById('app-loading')?.remove();
    }, { once: true });
  </script>
