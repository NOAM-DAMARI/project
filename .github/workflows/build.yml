name: Build Flutter APK and EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP package
        run: |
          mkdir -p extracted_project
          unzip -o lesson-manager-L.zip -d extracted_project

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: extracted_project

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
        working-directory: extracted_project

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: extracted_project/build/app/outputs/flutter-apk/app-release.apk

  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path extracted_project
          Expand-Archive -Path "lesson-manager-L.zip" -DestinationPath "extracted_project" -Force

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: extracted_project

      - name: Build Windows EXE
        run: flutter build windows --release
        working-directory: extracted_project

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: extracted_project/build/windows/x64/runner/release/
