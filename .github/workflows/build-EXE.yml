name: Build Flutter Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path extracted_project
          Expand-Archive -Path "lesson-manager-L.zip" -DestinationPath "extracted_project" -Force

      - name: Find Project Root
        shell: pwsh
        run: |
          $pubSpec = Get-ChildItem -Path "extracted_project" -Recurse -Filter "pubspec.yaml" | Where-Object { $_.FullName -notmatch '\\build\\' } | Select-Object -First 1
          if (-not $pubSpec) {
              Write-Error "pubspec.yaml not found!"
              exit 1
          }
          $projectDir = $pubSpec.DirectoryName
          Write-Host "Found project root at: $projectDir"
          echo "PROJECT_DIR=$projectDir" >> $env:GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Add Windows platform support
        run: flutter create . --platforms=windows
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Install dependencies
        run: flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build Windows EXE
        run: flutter build windows --release
        working-directory: ${{ env.PROJECT_DIR }}

      # שלב חדש וחכם: איתור אוטומטי של קובץ ה-EXE בשטח ויצירת תיקיית איסוף נקייה
      - name: Locate and Prepare EXE for Upload
        shell: pwsh
        run: |
          $projDir = $env:PROJECT_DIR
          $exeFile = Get-ChildItem -Path "$projDir\build\windows" -Recurse -Filter "*.exe" | Select-Object -First 1
          if ($exeFile) {
              Write-Host "Found EXE at: $($exeFile.FullName)"
              New-Item -ItemType Directory -Force -Path "$projDir/final_output"
              Copy-Item $exeFile.Directory.FullName -Destination "$projDir/final_output" -Recurse
          } else {
              Write-Error "EXE file not found anywhere under build/windows!"
              exit 1
          }

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: ${{ env.PROJECT_DIR }}/final_output/
