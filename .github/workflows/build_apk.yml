name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract ZIP
        run: |
          mkdir -p extracted_project
          unzip -o lesson-manager-L.zip -d extracted_project

      - name: Find Project Root
        run: |
          PUB_SPEC_PATH=$(find extracted_project -name "pubspec.yaml" -not -path '*/.*' -not -path '*/build*')
          PROJECT_DIR=$(dirname "$PUB_SPEC_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android support if missing
        run: flutter create . --platforms=android --org com.example.lessonmanager
        working-directory: ${{ env.PROJECT_DIR }}

      # הזרקה נכונה של buildFeatures ישירות לקובץ ה-build.gradle.kts עבור AGP 9.0
      - name: Configure buildFeatures in build.gradle.kts for AGP 9.0
        run: |
          python3 -c "
          path = 'android/app/build.gradle.kts'
          with open(path, 'r') as f:
              content = f.read()
          
          # הסרת הגדרות קודמות אם קיימות
          import re
          content = re.sub(r'buildFeatures\s*\{[^}]*\}', '', content)
          
          # הוספת הבלוק הנכון תחת android {
          if 'android {' in content and 'buildFeatures' not in content:
              content = content.replace('android {', 'android {\n    buildFeatures {\n        buildConfig = true\n    }', 1)
          
          with open(path, 'w') as f:
              f.write(content)
          "
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Install dependencies
        run: flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
