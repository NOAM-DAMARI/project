name: Build Flutter APK

on:
  push:
    branches:
      - main # שנה ל-master אם זה שם הענף הראשי שלך
  workflow_dispatch: # מאפשר הפעלה ידנית מתוך לשונית Actions ב-GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. משיכת הקוד מהמאגר
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. חיפוש אוטומטי של שורש הפרויקט (מוצא גם אם יש תיקיית עוטפת כמו lesson-manager-V2.5)
      - name: Find Project Root and Configure Directory
        run: |
          PUB_SPEC_PATH=$(find . -name "pubspec.yaml" -maxdepth 5 -not -path '*/.*' -not -path './build*')
          if [ -z "$PUB_SPEC_PATH" ]; then
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUB_SPEC_PATH")
          echo "Found project root at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # 3. הגדרת סביבת Java הנדרשת לפלאטר
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. התקנת סביבת Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 5. הורדת התלויות של הפרויקט מתוך תיקיית השורש שזוהתה
      - name: Install dependencies
        run: flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}

      # 6. בניית קובץ ה-APK בגרסת Release
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
        working-directory: ${{ env.PROJECT_DIR }}

      # 7. העלאת קובץ ה-APK כתוצר להורדה (Artifact)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
