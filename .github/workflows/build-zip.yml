name: Unzip and Build Windows EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Find and Extract ZIP file
      shell: powershell
      run: |
        # מחפש אוטומטית את קובץ ה-ZIP שהעלית בתיקייה
        $zipFile = Get-ChildItem -Filter *.zip | Select-Object -First 1
        if (-not $zipFile) {
            Write-Error "לא נמצא קובץ ZIP במאגר! אנא העלה קובץ ZIP."
            exit 1
        }
        Write-Host "מצאתי את קובץ ה-ZIP: $($zipFile.Name)"
        
        # חילוץ ה-ZIP לתיקיית פרוייקט
        Expand-Archive -Path $zipFile.FullName -DestinationPath "extracted_project" -Force

    - name: Setup Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'
        windows: true

    - name: Build Flutter Windows EXE
      shell: powershell
      run: |
        # מוצא את התיקייה שחולצה (גם אם יש תיקייה עוטפת בפנים)
        $projectDir = Get-ChildItem -Path "extracted_project" | Where-Object { $_.PSIsContainer } | Select-Object -First 1
        if ($null -eq $projectDir) { $projectDir = Get-Item "extracted_project" }
        
        Write-Host "נכנס לתיקיית הפרויקט: $($projectDir.FullName)"
        Set-Location $projectDir.FullName
        
        flutter pub get
        flutter build windows --release

    - name: Upload Windows EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe-output
        path: |
          extracted_project/**/build/windows/x64/runner/Release/
