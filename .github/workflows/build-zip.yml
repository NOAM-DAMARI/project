name: Unzip and Build Windows EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Find and Extract ZIP file
      shell: powershell
      run: |
        $zipFile = Get-ChildItem -Filter "*.zip" | Select-Object -First 1
        if (-not $zipFile) {
            Write-Error "לא נמצא קובץ ZIP במאגר!"
            exit 1
        }
        Write-Host "מצאתי את הקובץ: $($zipFile.Name)"
        Expand-Archive -Path $zipFile.FullName -DestinationPath "extracted_project" -Force

    - name: Setup Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Build Flutter Windows EXE
      shell: powershell
      run: |
        $dirs = Get-ChildItem -Path "extracted_project" -Directory
        if ($dirs.Count -eq 1) {
            $projectDir = $dirs[0].FullName
        } else {
            $projectDir = "extracted_project"
        }
        
        Write-Host "נכנס לתיקיית הפרויקט: $projectDir"
        Set-Location $projectDir
        
        flutter pub get
        flutter build windows --release

    - name: Upload Windows EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe-output
        path: extracted_project/**/build/windows/x64/runner/Release/
