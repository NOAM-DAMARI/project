name: Build Flutter Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # שלב חכם: מוצא אוטומטי באיזו תיקייה פנימית נמצא קובץ ה-pubspec.yaml ומגדיר אותה כתיקיית העבודה
      - name: Find Project Root
        shell: pwsh
        run: |
          $pubSpec = Get-ChildItem -Recurse -Filter "pubspec.yaml" | Where-Object { $_.FullName -notmatch '\\build\\' -and $_.FullName -notmatch '\\\.git' } | Select-Object -First 1
          if (-not $pubSpec) {
              Write-Error "pubspec.yaml not found!"
              exit 1
          }
          $projectDir = $pubSpec.DirectoryName
          Write-Host "Found project root at: $projectDir"
          echo "PROJECT_DIR=$projectDir" >> $env:GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # הפקודות הבאות ירצו באופן אוטומטי מתוך התיקייה שבה באמת נמצא הפרויקט!
      - name: Install dependencies
        run: flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build Windows EXE
        run: flutter build windows --release
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: ${{ env.PROJECT_DIR }}/build/windows/x64/runner/release/
